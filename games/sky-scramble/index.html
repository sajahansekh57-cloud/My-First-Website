<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sky Scramble</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="hud"><div class="brand">⚡ SKY SCRAMBLE</div><div class="box"><small>SCORE</small><strong id="score">0</strong></div><div class="box"><small>TIME</small><strong id="time">60</strong></div><div class="box"><small>STREAK</small><strong id="streak">0</strong></div><button class="box btn" id="pauseBtn">Ⅱ</button></header><main class="arena"><canvas id="gameCanvas" width="900" height="560"></canvas><div id="start" class="overlay"><section><div>⚡</div><h1>Sky Scramble</h1><p>Collect at least one yellow energy spark, avoid red enemy drones and reach the blue portal before time runs out.</p><button class="primary" id="startBtn">START GAME</button><small>WASD / Arrow Keys • Mobile touch controls</small></section></div><div id="pause" class="overlay hidden"><section><div>⏸</div><h2>Game Paused</h2><button class="primary" id="resumeBtn">RESUME</button></section></div><div id="end" class="overlay hidden"><section><div>🏆</div><h2 id="endTitle">Great Run!</h2><p id="endText"></p><button class="primary" id="againBtn">PLAY AGAIN</button></section></div></main><div class="mobile"><button data-k="ArrowUp">▲</button><div><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div></div><footer>Collect • Dodge • Reach the Portal</footer></div><script src="script.js"></script></body></html>
