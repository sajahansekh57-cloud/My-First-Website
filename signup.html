<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — GameHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(124,92,252,.18),transparent 28%),radial-gradient(circle at 85% 90%,rgba(87,190,255,.12),transparent 28%),#0b0d13;padding:20px}
    .signup-page{width:min(460px,100%);background:#11151f;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.48)}
    .signup-brand{display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:20px;margin-bottom:20px}
    .signup-page h1{text-align:center;margin:0;font-size:26px}
    .signup-subtitle{text-align:center;color:#929aab;font-size:13px;line-height:1.6;margin:9px 0 22px}
    .form-label{display:block;color:#b9bfcc;font-size:12px;font-weight:700;margin:12px 0 6px}
    .form-input{width:100%;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:#181c26;color:#fff;outline:none;padding:0 13px}
    .form-input:focus{border-color:#7c63d8;box-shadow:0 0 0 3px rgba(124,99,216,.14)}
    .signup-submit{width:100%;height:47px;border-radius:10px;margin-top:16px;background:linear-gradient(135deg,#a78bfa,#7c63d8);color:#fff;font-weight:800;cursor:pointer}
    .back-login{width:100%;margin-top:14px;padding:11px;border-radius:10px;background:#1a1f2a;color:#d7dbe5;font-weight:700;cursor:pointer}
    .signup-error{color:#ff9d9d;font-size:12px;line-height:1.5;margin-top:10px;min-height:18px}
    .small-note{text-align:center;color:#656d7d;font-size:10px;line-height:1.6;margin-top:17px}
  </style>
</head>
<body>
  <main class="signup-page">
    <a class="signup-brand" href="index.html"><span class="brand-mark">G</span><span>GameHub</span></a>
    <h1>Create your account</h1>
    <p class="signup-subtitle">Use any email address, including Gmail, and create a password for GameHub.</p>

    <form id="signupForm">
      <label class="form-label" for="signupName">Player name</label>
      <input class="form-input" id="signupName" type="text" placeholder="Your name" autocomplete="name" required>

      <label class="form-label" for="signupEmail">Email</label>
      <input class="form-input" id="signupEmail" type="email" placeholder="you@gmail.com" autocomplete="email" required>

      <label class="form-label" for="signupPassword">Password</label>
      <input class="form-input" id="signupPassword" type="password" placeholder="At least 6 characters" minlength="6" autocomplete="new-password" required>

      <label class="form-label" for="signupConfirm">Confirm password</label>
      <input class="form-input" id="signupConfirm" type="password" placeholder="Type password again" minlength="6" autocomplete="new-password" required>

      <div class="signup-error" id="signupError"></div>
      <button class="signup-submit" type="submit">Create Account</button>
    </form>

    <button class="back-login" id="backLogin" type="button">Back to Login</button>
    <div class="small-note">Your account is created in Firebase Authentication and can later be used to save game progress in Firestore.</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5WKh6tXIXLFxWAwmY1z5bBBPV8DVJPUM",
      authDomain: "gamehub-for-sajahan.firebaseapp.com",
      projectId: "gamehub-for-sajahan",
      storageBucket: "gamehub-for-sajahan.firebasestorage.app",
      messagingSenderId: "610152819687",
      appId: "1:610152819687:web:d6b531420d1136e13aab42",
      measurementId: "G-EBBQQB06WH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (selector) => document.querySelector(selector);

    $("#backLogin").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    $("#signupForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = $("#signupName").value.trim();
      const email = $("#signupEmail").value.trim();
      const password = $("#signupPassword").value;
      const confirm = $("#signupConfirm").value;
      const errorBox = $("#signupError");

      errorBox.textContent = "";

      if (password !== confirm) {
        errorBox.textContent = "Passwords do not match.";
        return;
      }

      if (password.length < 6) {
        errorBox.textContent = "Password must be at least 6 characters.";
        return;
      }

      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);

        await updateProfile(result.user, { displayName: name });

        await setDoc(doc(db, "users", result.user.uid), {
          uid: result.user.uid,
          displayName: name,
          email,
          photoURL: "",
          recentGames: [],
          favorites: [],
          createdAt: Date.now(),
          updatedAt: Date.now()
        });

        alert("Account created successfully!");
        window.location.href = "index.html";
      } catch (error) {
        console.error(error);

        const messages = {
          "auth/email-already-in-use": "This email already has an account. Please login.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/weak-password": "Password is too weak. Use at least 6 characters.",
          "auth/operation-not-allowed": "Email/Password sign-in is not enabled in Firebase.",
          "auth/network-request-failed": "Network problem. Please check your internet."
        };

        errorBox.textContent = messages[error.code] || error.message || "Could not create account.";
      }
    });
  </script>
</body>
</html>
