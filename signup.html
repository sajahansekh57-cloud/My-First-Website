
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d13">
  <meta name="description" content="Create your free GameHub account and enjoy online games.">
  <title>Sign Up - GameHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 15% 15%, #7551e826, transparent 35%),
        radial-gradient(circle at 90% 90%, #a78bfa18, transparent 35%),
        #0b0d13;
    }

    .signup-page {
      width: 100%;
      max-width: 460px;
    }

    .signup-brand {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .signup-card {
      padding: 32px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      background: #141824;
      box-shadow: 0 28px 80px #0007;
    }

    .signup-card h1 {
      margin: 0 0 10px;
      font-size: 28px;
      text-align: center;
    }

    .signup-description {
      margin: 0 0 25px;
      color: #9ba3b7;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .signup-form {
      display: grid;
      gap: 9px;
    }

    .signup-form label {
      margin-top: 8px;
      color: #d4d8e5;
      font-size: 12px;
      font-weight: 750;
    }

    .signup-form input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: #0e121b;
      color: #fff;
      outline: none;
    }

    .signup-form input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px #a78bfa20;
    }

    .password-hint {
      margin: 0;
      color: #929bb0;
      font-size: 11px;
      line-height: 1.6;
    }

    .signup-submit {
      width: 100%;
      min-height: 46px;
      margin-top: 15px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #b39aff, #7855e8);
      color: white;
      font-weight: 850;
      cursor: pointer;
    }

    .signup-submit:disabled {
      cursor: wait;
      opacity: .65;
    }

    .signup-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #202535;
      color: #e6e8f2;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .signup-message.visible {
      display: block;
    }

    .signup-message.error {
      background: #481f2a;
      color: #ffd8df;
    }

    .signup-bottom {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #a0a7b9;
      font-size: 12px;
      text-align: center;
    }

    .signup-bottom a,
    .back-home {
      color: #c2adff;
      font-weight: 800;
      text-decoration: none;
    }

    .back-home {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .signup-card {
        padding: 25px 19px;
      }

      .signup-card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="signup-page">
    <div class="signup-brand">
      <a class="logo" href="index.html">
        <span class="logo-icon">🎮</span>
        <span>GameHub</span>
      </a>
    </div>

    <section class="signup-card">
      <h1>Create Account</h1>
      <p class="signup-description">
        Join GameHub, discover games and keep enjoying your favourite challenges.
      </p>

      <form id="signupForm" class="signup-form">
        <label for="signupName">Your Name</label>
        <input
          id="signupName"
          name="name"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
          maxlength="60"
          required
        >

        <label for="signupEmail">Email Address</label>
        <input
          id="signupEmail"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="signupPassword">Password</label>
        <input
          id="signupPassword"
          name="password"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="6"
          required
        >
        <p class="password-hint">
          Use at least 6 characters. Choose a password you do not use on other websites.
        </p>

        <label for="signupConfirmPassword">Confirm Password</label>
        <input
          id="signupConfirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Enter the password again"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button id="signupSubmit" class="signup-submit" type="submit">
          Create My Account
        </button>
      </form>

      <div id="signupMessage" class="signup-message" role="status"
        aria-live="polite"></div>

      <div class="signup-bottom">
        Already have an account?
        <a href="index.html?openLogin=1">Log In</a>
      </div>
    </section>

    <a class="back-home" href="index.html">← Back to GameHub Home</a>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5WKh6tXIXLFxWAwmY1z5bBBPV8DVJPUM",
      authDomain: "gamehub-for-sajahan.firebaseapp.com",
      projectId: "gamehub-for-sajahan",
      storageBucket: "gamehub-for-sajahan.firebasestorage.app",
      messagingSenderId: "610152819687",
      appId: "1:610152819687:web:d6b531420d1136e13aab42",
      measurementId: "G-EBBQQB06WH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("signupForm");
    const nameInput = document.getElementById("signupName");
    const emailInput = document.getElementById("signupEmail");
    const passwordInput = document.getElementById("signupPassword");
    const confirmInput = document.getElementById("signupConfirmPassword");
    const submitButton = document.getElementById("signupSubmit");
    const message = document.getElementById("signupMessage");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.add("visible");
      message.classList.toggle("error", isError);
    }

    function friendlyError(error) {
      switch (error.code) {
        case "auth/email-already-in-use":
          return "This email already has an account. Please log in.";
        case "auth/invalid-email":
          return "Please enter a valid email address.";
        case "auth/weak-password":
          return "Your password is too weak. Choose a stronger password.";
        case "auth/operation-not-allowed":
          return "Email and password signup is not enabled in Firebase.";
        case "auth/network-request-failed":
          return "Network problem. Check your internet connection.";
        case "auth/too-many-requests":
          return "Too many attempts. Please try again later.";
        case "auth/unauthorized-domain":
          return "Add your website domain in Firebase Authorized domains.";
        default:
          return "Account creation failed. Please try again.";
      }
    }

    let accountCreated = false;

    onAuthStateChanged(auth, user => {
      if (user && accountCreated) {
        window.location.replace("index.html?signup=success");
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!name) {
        showMessage("Please enter your name.", true);
        nameInput.focus();
        return;
      }

      if (password.length < 6) {
        showMessage("Password must contain at least 6 characters.", true);
        passwordInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", true);
        confirmInput.focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating Account...";
      message.classList.remove("visible", "error");

      try {
        const result = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        await updateProfile(result.user, {
          displayName: name
        });

        accountCreated = true;
        showMessage("Account created! Opening GameHub...");

        window.location.replace("index.html?signup=success");
      } catch (error) {
        console.error("Signup error:", error);
        showMessage(friendlyError(error), true);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create My Account";
      }
    });
  </script>
</body>
</html>
